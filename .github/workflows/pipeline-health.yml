name: Ground Pipeline Health

on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:

concurrency:
  group: pipeline-health
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Evaluate WU, daily Open-Meteo, and UOGW casey-wu
        id: check
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          now = datetime.now(timezone.utc)
          reasons = []
          wu_stale = False
          daily_stale = False
          uogw_stale = False
          temp_f = None
          wu_age_h = None
          daily_name = None
          wu_collected = None

          def parse_ts(ts):
              if not ts:
                  return None
              s = str(ts)
              if len(s) == 10 and s[4] == "-":
                  return datetime.fromisoformat(s + "T12:00:00+00:00")
              return datetime.fromisoformat(s.replace("Z", "+00:00"))

          wu_path = Path("ground-weather/wunderground/latest.json")
          if not wu_path.exists():
              wu_stale = True
              reasons.append("WU latest.json missing")
          else:
              wu = json.loads(wu_path.read_text())
              current = wu.get("current") or {}
              temp_f = current.get("temp_f")
              wu_collected = (wu.get("collection") or {}).get("collected_at_utc") or current.get("time_utc")
              t = parse_ts(wu_collected)
              if t is None:
                  wu_stale = True
                  reasons.append("WU no collected_at_utc")
              else:
                  wu_age_h = (now - t).total_seconds() / 3600.0
                  if wu_age_h > 2.5:
                      wu_stale = True
                      reasons.append(f"WU age {wu_age_h:.2f}h > 2.5h")

          daily_dir = Path("ground-weather/daily")
          daily_files = sorted(daily_dir.glob("*.json")) if daily_dir.exists() else []
          if not daily_files:
              daily_stale = True
              reasons.append("no Open-Meteo daily files")
          else:
              latest_daily = daily_files[-1]
              daily_name = latest_daily.name
              stem = latest_daily.stem
              t = parse_ts(stem)
              if t is None:
                  daily_stale = True
                  reasons.append(f"bad daily name {daily_name}")
              else:
                  age_h = (now - t).total_seconds() / 3600.0
                  if age_h > 36:
                      daily_stale = True
                      reasons.append(f"Open-Meteo daily {daily_name} age {age_h:.1f}h > 36h")

          token = os.environ.get("GH_TOKEN", "")
          uogw_collected = None
          req = urllib.request.Request(
              "https://raw.githubusercontent.com/Midwest-Stratospheric/Unified-Open-Global-Weather/main/layers/ground/casey/wunderground/latest.json",
              headers={"User-Agent": "msds-pipeline-health"},
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  uogw = json.loads(resp.read().decode())
              uogw_collected = (uogw.get("collection") or {}).get("collected_at_utc")
              if not uogw_collected:
                  uogw_stale = True
                  reasons.append("UOGW casey-wu missing collected_at_utc")
              elif wu_collected and uogw_collected != wu_collected:
                  uogw_stale = True
                  reasons.append(f"UOGW casey-wu {uogw_collected} != msds WU {wu_collected}")
          except Exception as e:
              uogw_stale = True
              reasons.append(f"UOGW casey-wu fetch failed: {e}")

          report = {
              "schema": "msds-data.pipeline_health.v1",
              "generated_at_utc": now.strftime("%Y-%m-%dT%H:%M:%SZ"),
              "ok": not (wu_stale or daily_stale),
              "wu_stale": wu_stale,
              "daily_stale": daily_stale,
              "uogw_casey_wu_stale": uogw_stale,
              "wu_age_hours": None if wu_age_h is None else round(wu_age_h, 2),
              "temp_f": temp_f,
              "wu_collected_at_utc": wu_collected,
              "uogw_collected_at_utc": uogw_collected,
              "open_meteo_daily": daily_name,
              "reasons": reasons,
              "host": "github-actions",
              "note": "Replaces Hostinger cron and Grok pipeline health bot.",
          }
          Path("status").mkdir(exist_ok=True)
          Path("status/pipeline-health.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a") as f:
              f.write(f"wu_stale={'true' if wu_stale else 'false'}\n")
              f.write(f"daily_stale={'true' if daily_stale else 'false'}\n")
              f.write(f"uogw_stale={'true' if uogw_stale else 'false'}\n")
          PY

      - name: Commit pipeline health status
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ops(health): ground pipeline health report"
          file_pattern: status/pipeline-health.json
          commit_user_name: MSDS Data Bot
          commit_user_email: launchcontrol@midwestsds.com

      - name: Redispatch WU ingest + WU health if stale
        if: steps.check.outputs.wu_stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for wf in wu-ground-weather.yml wu-health.yml; do
            echo "Dispatching $wf"
            curl -sS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/${wf}/dispatches" \
              -d '{"ref":"main"}'
          done

      - name: Redispatch daily Open-Meteo if stale
        if: steps.check.outputs.daily_stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/daily-ground-weather.yml/dispatches" \
            -d '{"ref":"main"}'

      - name: Redispatch UOGW huggingface-daily if casey-wu stale
        if: steps.check.outputs.uogw_stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "CROSS_REPO_TOKEN not set; cannot dispatch Unified-Open-Global-Weather/huggingface-daily.yml"
            exit 0
          fi
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Midwest-Stratospheric/Unified-Open-Global-Weather/actions/workflows/huggingface-daily.yml/dispatches" \
            -d '{"ref":"main"}'
