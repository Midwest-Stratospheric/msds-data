name: Daily Ground Weather (Casey IL)

on:
  schedule:
    # 00:05 UTC ≈ 19:05 previous calendar day CDT / 18:05 CST
    # Collects near evening local time so daily aggregates are mostly observed.
    - cron: "5 0 * * *"
  workflow_dispatch:  # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update-ground-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and write daily ground weather JSON
        run: python scripts/fetch_ground_weather.py

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: add/update Midwest Stratospheric Data Systems Ground Weather Data for ${{ github.run_id }}"
          file_pattern: ground-weather/daily/*.json
          commit_user_name: MSDS Data Bot
          commit_user_email: launchcontrol@midwestsds.com
